name: ML Kit OCR research
run-name: ML Kit OCR research ${{ inputs.mindloop_cycle || 'standalone' }}
on:
  push:
    branches: [main]
    paths: ['mlkit_lab.py', 'mlkit_fusion.py', 'feldexa_forms.py', 'test_mlkit_lab.py', 'test_mlkit_fusion.py', 'mlkit-android/**', 'fixtures/**', '.github/workflows/mlkit.yml']
  workflow_dispatch:
    inputs:
      mindloop_cycle:
        description: Opaque integration cycle identifier
        required: false
        type: string
        default: ''
  schedule:
    - cron: '37 2 * * *'

permissions:
  contents: read

jobs:
  research:
    if: github.repository == 'xxammaxx/mindloop-ocr-lab' && github.ref == 'refs/heads/main' && (vars.MINDLOOP_RING_MANAGED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.mindloop_cycle != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: ocr-research-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      persisted: ${{ steps.persist.outputs.persisted }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: pending
        run: |
          candidate=$(python3 mlkit_lab.py pending)
          case "$candidate" in
            region-v2-small|region-v3-short) echo "candidate=$candidate" >> "$GITHUB_OUTPUT" ;;
            EXHAUSTED|BLOCKED) echo "$candidate" ;;
            *) exit 1 ;;
          esac
      - id: prepare
        if: steps.pending.outputs.candidate != ''
        env:
          CANDIDATE: ${{ steps.pending.outputs.candidate }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil fonts-dejavu-core poppler-utils
          (cd fixtures && sha256sum -c SHA256SUMS)
          /usr/bin/python3 -m unittest -v
          /usr/bin/python3 mlkit_lab.py prepare --candidate "$CANDIDATE" --assets mlkit-android/app/src/androidTest/assets --truth "$RUNNER_TEMP/mlkit-truth.json"
          curl --fail --location --max-time 180 --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - id: experiment
        if: steps.pending.outputs.candidate != ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          CANDIDATE: ${{ steps.pending.outputs.candidate }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash mlkit-android/run-research.sh
      - name: Record failed setup or experiment without retrying unchanged context
        if: failure() && steps.pending.outputs.candidate != ''
        env:
          CANDIDATE: ${{ steps.pending.outputs.candidate }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: |
          stage=emulator-or-score
          if [[ "$PREPARE_OUTCOME" != success ]]; then stage=setup; fi
          python3 mlkit_lab.py error --candidate "$CANDIDATE" --error-stage "$stage"
      - id: persist
        name: Persist only scored evidence or failure receipt
        if: always() && steps.pending.outputs.candidate != ''
        run: |
          set -euo pipefail
          git add -- results/
          if git diff --cached --quiet; then exit 0; fi
          path=$(git diff --cached --name-only)
          [[ "$path" =~ ^results/[0-9a-f]{64}/ledger\.json$ ]] || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: record existing ML Kit pipeline experiment'
          git push origin HEAD:main
          echo 'persisted=true' >> "$GITHUB_OUTPUT"
          printf '%s\n' "$path" > "$RUNNER_TEMP/mindloop-ledger-path"
          git rev-parse HEAD > "$RUNNER_TEMP/mindloop-ledger-commit"
      - name: Bind persisted evidence to this workflow run
        if: success() && steps.persist.outputs.persisted == 'true' && inputs.mindloop_cycle != ''
        env:
          CYCLE: ${{ inputs.mindloop_cycle }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, hashlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          cycle=os.environ['CYCLE']
          assert re.fullmatch(r'[0-9]{1,20}',cycle)
          ledger=(p/'mindloop-ledger-path').read_text().strip()
          data=pathlib.Path(ledger).read_bytes()
          record={'schema':1,'cycle':cycle,'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'commit':(p/'mindloop-ledger-commit').read_text().strip(),'path':ledger,'sha256':hashlib.sha256(data).hexdigest()}
          (p/'mindloop-ocr-receipt.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          PY
      - name: Upload exact OCR evidence receipt
        if: success() && steps.persist.outputs.persisted == 'true' && inputs.mindloop_cycle != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mindloop-ocr-${{ github.run_id }}
          path: ${{ runner.temp }}/mindloop-ocr-receipt.json
          if-no-files-found: error
          retention-days: 7

  continue:
    needs: research
    if: needs.research.result == 'success' && needs.research.outputs.persisted == 'true' && inputs.mindloop_cycle == '' && vars.MINDLOOP_RING_MANAGED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: ocr-research-main
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m unittest test_mlkit_next -v
      - run: python3 mlkit_next.py
        env:
          GH_TOKEN: ${{ github.token }}
